name: CI/CD

on:
  push:
    branches:
      - '**'
  pull_request:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Lint
        run: npm run lint
      - name: Build
        run: npm run build
      - name: Test
        run: TS_NODE_PROJECT=tsconfig.test.json npx mocha --require ts-node/register --require tsconfig-paths/register --require test/setup-mocha.js "src/**/*.test.ts"

  deploy:
    runs-on: ubuntu-latest
    needs: [test]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    environment: main
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install dependencies
        run: npm install
      - name: Create screeps.json
        env:
          SCREEPS_SECRET: ${{ secrets.SCREEPS }}
        run: echo "$SCREEPS_SECRET" > screeps.json
      - name: Deploy to Screeps
        run: npm run push-main
